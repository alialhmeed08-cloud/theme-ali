name: Build
on:
  push:
    branches: [master, main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g pnpm
      - run: pnpm install
      - run: pnpm run production
      - name: Push public folder
        run: |
          git config user.name "builder-bot"
          git config user.email "builder@bot"
          git add public/
          git commit -m "build: compile assets" || exit 0
          git push
